<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Canonical -->
    <link rel="canonical" href="https://swaadsevak.vercel.app/" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://swaadsevak.vercel.app/" />
    <meta property="og:title" content="SwaadSevak — Restaurant POS & Management Platform" />
    <meta property="og:description" content="Fast 3-click POS billing, offline KOT printing, real-time inventory deduction, Zomato/Swiggy sync, and rapid restaurant website advisory." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://swaadsevak.vercel.app/" />
    <meta property="twitter:title" content="SwaadSevak — Restaurant POS & Management Platform" />

    <!-- Typography: Inter for UI/Body/Headings, Noto Sans Devanagari for Hindi, JetBrains Mono for Code/Prices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data: Organization & SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://swaadsevak.vercel.app/#organization",
          "name": "SwaadSevak",
          "url": "https://swaadsevak.vercel.app/",
          "logo": "https://swaadsevak.vercel.app/brand/logo.svg",
          "description": "Modern restaurant POS, real-time kitchen display, and restaurant management platform for Indian food businesses.",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+91-98765-43210",
            "contactType": "sales",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi"]
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://swaadsevak.vercel.app/#software",
          "name": "SwaadSevak Restaurant POS",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, Android, iOS, Windows, macOS",
          "offers": {
            "@type": "Offer",
            "price": "1499",
            "priceCurrency": "INR"
          },
          "description": "All-in-one restaurant POS with 3-click billing, offline KOT, automated recipe inventory, and Zomato/Swiggy aggregator sync."
        }
      ]
    }
    </script>

  <body class="bg-[#FAF6F0] dark:bg-[#140A06] text-[#170C08] dark:text-[#FAF6F0] font-sans antialiased selection:bg-orange-200 selection:text-orange-950 overflow-x-hidden min-h-screen">
