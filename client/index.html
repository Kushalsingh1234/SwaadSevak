    <!-- JSON-LD Structured Data for Organization, SoftwareApplication & FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://swaadsevak.vercel.app/#organization",
          "name": "SwaadSevak",
          "url": "https://swaadsevak.vercel.app/",
          "logo": "https://swaadsevak.vercel.app/brand/logo.svg",
          "description": "Restaurant POS, Kitchen Ticket OS and 24-hour website platform for Indian food businesses.",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+91-98765-43210",
            "contactType": "sales",
            "areaServed": "IN",
            "availableLanguage": ["English", "Hindi"]
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://swaadsevak.vercel.app/#software",
          "name": "SwaadSevak Restaurant POS",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, Android, iOS, Windows, macOS",
          "offers": {
            "@type": "Offer",
            "price": "1499",
            "priceCurrency": "INR"
          },
          "description": "All-in-one restaurant management platform with 3-click billing, KOT printing, real-time inventory, Zomato/Swiggy aggregator sync, and 24-hour restaurant website deployment."
        }
      ]
    }

  <body class="bg-cream-50 text-maroon-950 font-sans antialiased selection:bg-saffron-100 selection:text-maroon-900 overflow-x-hidden min-h-screen">
